<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Padel – Live Availability Dashboard</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f9f9f7;
        color: #1a1a1a;
        padding: 2rem 1.5rem;
        max-width: 720px;
        margin: 0 auto;
      }
      h1 {
        font-size: 20px;
        font-weight: 500;
        margin-bottom: 0.25rem;
      }
      .subtitle {
        font-size: 13px;
        color: #888;
        margin-bottom: 1.5rem;
      }
      .top-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 1.5rem;
        flex-wrap: wrap;
        gap: 8px;
      }
      .live {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 12px;
        color: #1d9e75;
        font-weight: 500;
      }
      .dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #1d9e75;
      }
      .updated {
        font-size: 12px;
        color: #999;
      }
      button {
        font-size: 13px;
        padding: 6px 14px;
        cursor: pointer;
        background: white;
        border: 0.5px solid #ccc;
        border-radius: 8px;
        color: #333;
      }
      button:hover {
        background: #f0f0ee;
      }
      .metric-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
        gap: 10px;
        margin-bottom: 1.5rem;
      }
      .metric {
        background: #f0f0ee;
        border-radius: 8px;
        padding: 12px 14px;
      }
      .metric-label {
        font-size: 12px;
        color: #888;
        margin-bottom: 4px;
      }
      .metric-value {
        font-size: 22px;
        font-weight: 500;
      }
      .section-title {
        font-size: 13px;
        font-weight: 500;
        color: #888;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        margin-bottom: 12px;
      }
      .game-card {
        background: white;
        border: 0.5px solid #e0e0dc;
        border-radius: 12px;
        padding: 14px 16px;
        margin-bottom: 8px;
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .game-rank {
        font-size: 13px;
        font-weight: 500;
        color: #aaa;
        min-width: 20px;
      }
      .game-info {
        flex: 1;
      }
      .game-slot {
        font-size: 15px;
        font-weight: 500;
      }
      .game-sub {
        font-size: 12px;
        color: #888;
        margin-top: 2px;
      }
      .badge {
        display: inline-block;
        font-size: 11px;
        font-weight: 500;
        padding: 3px 8px;
        border-radius: 8px;
        margin-left: 6px;
      }
      .badge-double {
        background: #e1f5ee;
        color: #085041;
      }
      .badge-single {
        background: #e6f1fb;
        color: #0c447c;
      }
      .bar-wrap {
        width: 110px;
      }
      .bar-bg {
        background: #f0f0ee;
        border-radius: 4px;
        height: 6px;
        overflow: hidden;
      }
      .bar-fill {
        height: 6px;
        border-radius: 4px;
        background: #1d9e75;
      }
      .bar-label {
        font-size: 12px;
        color: #aaa;
        text-align: right;
        margin-top: 3px;
      }
      .ts-row {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 8px 12px;
        background: white;
        border: 0.5px solid #e0e0dc;
        border-radius: 8px;
        font-size: 13px;
        margin-bottom: 6px;
      }
      .ts-idx {
        font-size: 12px;
        color: #aaa;
        min-width: 18px;
      }
      .ts-name {
        font-weight: 500;
        flex: 1;
      }
      .ts-time {
        color: #aaa;
        font-size: 12px;
      }
      .divider {
        border: none;
        border-top: 0.5px solid #e0e0dc;
        margin: 1.5rem 0;
      }
      .empty {
        font-size: 14px;
        color: #aaa;
        text-align: center;
        padding: 2rem;
        background: #f5f5f3;
        border-radius: 8px;
      }
      .error-box {
        font-size: 13px;
        color: #a32d2d;
        background: #fcebeb;
        border-radius: 8px;
        padding: 10px 14px;
        margin-bottom: 1rem;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #1a1a18;
          color: #e8e8e4;
        }
        .metric {
          background: #2a2a28;
        }
        .metric-label,
        .updated,
        .game-sub,
        .bar-label,
        .ts-time,
        .ts-idx {
          color: #888;
        }
        .game-card,
        .ts-row {
          background: #242422;
          border-color: #333;
        }
        button {
          background: #242422;
          border-color: #444;
          color: #e8e8e4;
        }
        button:hover {
          background: #2e2e2c;
        }
        .bar-bg {
          background: #2a2a28;
        }
        .empty {
          background: #222220;
          color: #666;
        }
        .divider {
          border-color: #333;
        }
      }
    </style>
  </head>
  <body>
    <h1>Padel – Weekly Availability</h1>
    <p class="subtitle">
      Live results · form resets every Sunday at 8pm · deadline Tuesday 11:59pm
    </p>

    <div class="top-bar">
      <div class="live">
        <div class="dot" id="status-dot"></div>
        Live · auto-refresh every 60s
      </div>
      <span class="updated" id="last-updated"></span>
      <button onclick="loadData()">Refresh</button>
    </div>

    <div id="error-box"></div>

    <div class="metric-grid">
      <div class="metric">
        <div class="metric-label">Responses</div>
        <div class="metric-value" id="m-responses">—</div>
      </div>
      <div class="metric">
        <div class="metric-label">Games found</div>
        <div class="metric-value" id="m-games">—</div>
      </div>
      <div class="metric">
        <div class="metric-label">Double courts</div>
        <div class="metric-value" id="m-double">—</div>
      </div>
      <div class="metric">
        <div class="metric-label">Players covered</div>
        <div class="metric-value" id="m-players">—</div>
      </div>
    </div>

    <div style="margin-bottom: 1.5rem">
      <div class="section-title">Best slots to play</div>
      <div id="games-list"><div class="empty">Loading...</div></div>
    </div>

    <hr class="divider" />

    <div>
      <div class="section-title">Response timestamps</div>
      <div id="ts-list"><div class="empty">Loading...</div></div>
    </div>

    <script>
      const CSV_URL =
        "https://docs.google.com/spreadsheets/d/e/2PACX-1vRkUA_4W1NvttLXXqvHI1tb00rjiCG7JvkAqOGyWatNKjRnI55ZP4iX13k5qTej3M84KaO_PgqFuSU6/pub?gid=1763348503&single=true&output=csv";

      const SLOTS = [
        { key: "Monday – Morning", time: "9am–12pm" },
        { key: "Monday – Midday", time: "12pm–2pm" },
        { key: "Monday – Afternoon", time: "2pm–6pm" },
        { key: "Monday – Night", time: "6pm–11pm" },
        { key: "Tuesday – Morning", time: "9am–12pm" },
        { key: "Tuesday – Midday", time: "12pm–2pm" },
        { key: "Tuesday – Afternoon", time: "2pm–6pm" },
        { key: "Tuesday – Night", time: "6pm–11pm" },
        { key: "Wednesday – Morning", time: "9am–12pm" },
        { key: "Wednesday – Midday", time: "12pm–2pm" },
        { key: "Wednesday – Afternoon", time: "2pm–6pm" },
        { key: "Wednesday – Night", time: "6pm–11pm" },
        { key: "Thursday – Morning", time: "9am–12pm" },
        { key: "Thursday – Midday", time: "12pm–2pm" },
        { key: "Thursday – Afternoon", time: "2pm–6pm" },
        { key: "Thursday – Night", time: "6pm–11pm" },
        { key: "Friday – Morning", time: "9am–12pm" },
        { key: "Friday – Midday", time: "12pm–2pm" },
        { key: "Friday – Afternoon", time: "2pm–6pm" },
        { key: "Friday – Night", time: "6pm–11pm" },
        { key: "Saturday – Morning", time: "9am–12pm" },
        { key: "Saturday – Midday", time: "12pm–2pm" },
        { key: "Saturday – Afternoon", time: "2pm–6pm" },
        { key: "Saturday – Evening", time: "6pm–8pm" },
        { key: "Sunday – Morning", time: "9am–12pm" },
        { key: "Sunday – Midday", time: "12pm–2pm" },
        { key: "Sunday – Afternoon", time: "2pm–6pm" },
        { key: "Sunday – Evening", time: "6pm–8pm" },
      ];

      function parseCSV(text) {
        const lines = text.trim().split("\n");
        if (lines.length < 2) return [];
        return lines
          .slice(1)
          .map((line) => {
            const cols = [];
            let cur = "",
              inQ = false;
            for (let i = 0; i < line.length; i++) {
              if (line[i] === '"') {
                inQ = !inQ;
              } else if (line[i] === "," && !inQ) {
                cols.push(cur.trim());
                cur = "";
              } else {
                cur += line[i];
              }
            }
            cols.push(cur.trim());
            const ts = cols[0] || "";
            const name = cols[1] || "";
            const weekdays = cols[2] || "";
            const weekends = cols[3] || "";
            const allSlots = [weekdays, weekends].join(", ");
            const slots = allSlots
              .split(",")
              .map((s) => s.trim())
              .filter((s) => s.length > 0);
            return { ts, name, slots };
          })
          .filter((r) => r.name);
      }

      function computeGames(responses) {
        const counts = {};
        SLOTS.forEach((s) => {
          counts[s.key] = 0;
        });
        responses.forEach((r) => {
          r.slots.forEach((sl) => {
            if (counts[sl] !== undefined) counts[sl]++;
          });
        });
        return Object.entries(counts)
          .filter(([, v]) => v >= 4)
          .sort((a, b) => b[1] - a[1]);
      }

      function render(responses) {
        const now = new Date();
        document.getElementById("last-updated").textContent =
          "Updated " +
          now.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
        document.getElementById("m-responses").textContent = responses.length;

        const games = computeGames(responses);
        const doubles = games.filter(([, v]) => v >= 6);
        document.getElementById("m-games").textContent = games.length;
        document.getElementById("m-double").textContent = doubles.length;

        const covered = new Set();
        games.forEach(([sl]) =>
          responses.forEach((r) => {
            if (r.slots.includes(sl)) covered.add(r.name);
          }),
        );
        document.getElementById("m-players").textContent = covered.size + "/10";

        const gl = document.getElementById("games-list");
        if (!games.length) {
          gl.innerHTML = '<div class="empty">No slot with 4+ players yet</div>';
        } else {
          const maxV = games[0][1];
          gl.innerHTML = games
            .map(([sl, count], i) => {
              const isDouble = count >= 6;
              const info = SLOTS.find((s) => s.key === sl);
              const time = info ? info.time : "";
              const pct = Math.round((count / maxV) * 100);
              return `<div class="game-card">
        <div class="game-rank">${i + 1}</div>
        <div class="game-info">
          <div class="game-slot">${sl}<span class="badge ${isDouble ? "badge-double" : "badge-single"}">${isDouble ? "2 courts" : "1 court"}</span></div>
          <div class="game-sub">${time} · ${count} players</div>
        </div>
        <div class="bar-wrap">
          <div class="bar-bg"><div class="bar-fill" style="width:${pct}%"></div></div>
          <div class="bar-label">${count} / 10</div>
        </div>
      </div>`;
            })
            .join("");
        }

        const tl = document.getElementById("ts-list");
        if (!responses.length) {
          tl.innerHTML = '<div class="empty">No responses yet</div>';
        } else {
          const sorted = [...responses].sort(
            (a, b) => new Date(a.ts) - new Date(b.ts),
          );
          tl.innerHTML = sorted
            .map(
              (r, i) =>
                `<div class="ts-row">
        <span class="ts-idx">${i + 1}</span>
        <span class="ts-name">${r.name}</span>
        <span class="ts-time">${r.ts}</span>
      </div>`,
            )
            .join("");
        }
      }

      async function loadData() {
        try {
          const resp = await fetch(CSV_URL);
          if (!resp.ok) throw new Error("HTTP " + resp.status);
          const text = await resp.text();
          const responses = parseCSV(text);
          document.getElementById("error-box").innerHTML = "";
          document.getElementById("status-dot").style.background = "#1D9E75";
          render(responses);
        } catch (e) {
          document.getElementById("error-box").innerHTML =
            '<div class="error-box">Could not load sheet data. Make sure it is published as CSV and publicly accessible.</div>';
          document.getElementById("status-dot").style.background = "#E24B4A";
          document.getElementById("last-updated").textContent =
            "Last attempt: " +
            new Date().toLocaleTimeString([], {
              hour: "2-digit",
              minute: "2-digit",
            });
        }
      }

      loadData();
      setInterval(loadData, 60000);
    </script>
  </body>
</html>
